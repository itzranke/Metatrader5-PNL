services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mt5
      POSTGRES_PASSWORD: mt5
      POSTGRES_DB: mt5journal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
